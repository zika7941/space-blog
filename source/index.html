<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIKA · 加载中</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:"-apple-system","Segoe UI","Noto Sans SC",sans-serif;
  background:#000;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
  animation:fadeIn 1.2s ease;
}
.logo{
  font-size:2.8rem;
  font-weight:800;
  letter-spacing:.12em;
  color:#fff;
  position:relative;
}
.logo::after{
  content:"";
  display:inline-block;
  width:10px;
  height:10px;
  margin-left:10px;
  background:#00a8ff;
  border-radius:50%;
  animation:blink 1.4s ease-in-out infinite;
}
.sub{
  font-size:.8rem;
  font-weight:600;
  letter-spacing:.3em;
  color:rgba(255,255,255,.45);
  text-transform:uppercase;
}
.line{
  width:120px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(0,168,255,.6), transparent);
}
.status{
  font-size:.72rem;
  color:rgba(255,255,255,.35);
  font-family:"JetBrains Mono",monospace;
}
.status .ok{color:#00ff88}

@keyframes blink{
  0%,100%{opacity:1;box-shadow:0 0 12px #00a8ff}
  50%{opacity:.3;box-shadow:none}
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">ZIKA</div>
  <div class="line"></div>
  <div class="sub">System Initializing</div>
  <div class="status">// <span class="ok">STATUS</span> · BUILD IN PROGRESS</div>
</div>
</body>
</html>
